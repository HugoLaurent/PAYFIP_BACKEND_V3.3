      # IPv4 en priorité pour toute résolution DNS sortante.
      NODE_OPTIONS: --dns-result-order=ipv4first
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3335"
      DB_HOST: postgres
      DB_PORT: "5432"
      SVC_GESTION_BASE_URL: http://svc-gestion:3333
      SVC_MAIL_BASE_URL: http://svc-mail:3339
      SVC_AUTH_BASE_URL: http://svc-auth:3334
      SELF_BASE_URL: http://svc-billetterie:3335
    networks:
      - payfip-internal

  svc-factures:
    build:
      context: ../svc-factures
    container_name: svc-factures
    restart: unless-stopped
    env_file: ./env/svc-factures.env
