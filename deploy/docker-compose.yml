      HOST: 0.0.0.0
      PORT: "3337"
      DB_HOST: postgres
      DB_PORT: "5432"
      SVC_GESTION_BASE_URL: http://svc-gestion:3333
      SVC_AUTH_BASE_URL: http://svc-auth:3334
      SVC_MAIL_BASE_URL: http://svc-mail:3339
