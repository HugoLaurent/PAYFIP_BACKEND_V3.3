name: Deploy

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, svc-auth, svc-billetterie, svc-factures, svc-gestion, svc-mail]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: hlaurent
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/payfip/backend-src
            git pull origin main
            sudo /opt/payfip/deploy/bin/compose-deploy.sh build gateway svc-auth svc-billetterie svc-factures svc-gestion svc-mail
            sudo /opt/payfip/deploy/bin/compose-deploy.sh up -d gateway svc-auth svc-billetterie svc-factures svc-gestion svc-mail
